<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Checker Admin Uploader</title>
  <style>
    :root {
      --bg: #FFFBEB;
      --card: #ffffff;
      --text: #78350F;
      --muted: #A89080;
      --border: #E5D4C8;
      --brand: #D97706;
      --ok: #0f766e;
      --warn: #F59E0B;
      --bad: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top right, #F5E6D3 0%, #FFFBEB 40%, #FFF8F0 100%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    .shell {
      max-width: 100%;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 200px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      line-height: 1.45;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .photos-actions {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .photos-card {
      position: relative;
      padding-top: 22px;
    }

    .icon-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background: #FEF3E2;
      border-color: #E5D4C8;
      color: #78350F;
    }

    .icon-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px;
      padding: 6px 10px;
      color: var(--muted);
      background: #f8fafc;
    }

    .pill.photos-pill {
      background: #f1f5f9;
      border-color: #d6e0ec;
      font-size: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.45;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      padding: 10px 12px;
      min-height: 72px;
    }

    .status.ok { border-color: #99f6e4; background: #f0fdfa; color: var(--ok); }
    .status.warn { border-color: #fed7aa; background: #fff7ed; color: var(--warn); }
    .status.bad { border-color: #fecaca; background: #fef2f2; color: var(--bad); }

    /* Modal overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 28px 32px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .modal-box .modal-warning {
      font-size: 13px;
      font-weight: 700;
      color: var(--bad);
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }
    .modal-box .modal-spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-box .modal-status {
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
      color: var(--text);
      min-height: 40px;
    }
    .modal-box .modal-status.ok { color: var(--ok); }
    .modal-box .modal-status.bad { color: var(--bad); }
    .modal-box .modal-close-btn {
      display: none;
      margin-top: 16px;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      padding: 10px 28px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-box .modal-close-btn.visible { display: inline-block; }

    code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 5px;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Password gate -->
  <div id="passwordGate" style="position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at top right,#F5E6D3 0%,#FFFBEB 40%,#FFF8F0 100%);display:flex;align-items:center;justify-content:center">
    <div style="background:#fff;border:2px solid #78350F;border-radius:12px;padding:40px;text-align:center;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.12)">
      <div style="font-size:48px;margin-bottom:12px">🔒</div>
      <h2 style="margin:0 0 8px;color:#78350F;font-size:20px;letter-spacing:1px">ADMIN ACCESS</h2>
      <p style="margin:0 0 20px;color:#A89080;font-size:14px">Enter password to continue</p>
      <input id="gatePassword" type="password" placeholder="Password" autocomplete="off"
        style="width:100%;padding:12px;border:2px solid #E5D4C8;border-radius:8px;font-size:16px;text-align:center;outline:none"
        onkeydown="if(event.key==='Enter')document.getElementById('gateSubmit').click()" />
      <p id="gateError" style="color:#b91c1c;font-size:13px;margin:8px 0 0;display:none">INCORRECT PASSWORD</p>
      <button id="gateSubmit" type="button" onclick="checkGatePassword()"
        style="margin-top:16px;width:100%;padding:12px;background:#78350F;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px">
        UNLOCK
      </button>
    </div>
  </div>
  <script>
    var _adminToken = '';
    function checkGatePassword() {
      var pw = document.getElementById('gatePassword').value;
      if (pw === 'Admin2026') {
        _adminToken = pw;
        document.getElementById('gatePassword').value = '';
        document.getElementById('gatePassword').blur();
        document.getElementById('passwordGate').style.display = 'none';
        // Load sheet iframe only after login to prevent password leaking into cells
        var iframe = document.getElementById('sheetEmbed');
        iframe.src = 'https://docs.google.com/spreadsheets/d/1EDvYjDQVIpwib5PmQ5sbSchJI_B5HNHWNomXRLOxtk4/edit?rm=minimal&gid=0';
      } else {
        document.getElementById('gateError').style.display = 'block';
        document.getElementById('gatePassword').value = '';
        document.getElementById('gatePassword').focus();
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('gatePassword').focus();
    });
  </script>

  <div class="shell">
    <div class="card">
      <h1>ID Checker Admin</h1>
    </div>

    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="field" style="flex:1;min-height:0;display:flex;flex-direction:column">
        <div class="row" style="gap:10px;align-items:center;margin-bottom:6px">
          <label style="margin:0">Google Sheet — <code>student id</code></label>
          <button class="btn btn-sm" type="button" onclick="document.getElementById('sheetEmbed').src = document.getElementById('sheetEmbed').src">Refresh</button>
          <button class="btn btn-sm" type="button" onclick="window.open('https://docs.google.com/spreadsheets/d/1EDvYjDQVIpwib5PmQ5sbSchJI_B5HNHWNomXRLOxtk4/edit#gid=0','sheetEditor','width=1200,height=800,menubar=no,toolbar=no')">Open Editor ↗</button>
        </div>
        <iframe id="sheetEmbed"
          src="about:blank"
          style="width:100%;flex:1;border:1px solid var(--border);border-radius:8px;background:#fff"
          loading="lazy" allow="clipboard-read; clipboard-write"></iframe>
      </div>
    </div>

    <div class="card photos-card">
      <button class="icon-btn" id="downloadZipBtn" type="button" aria-label="Download Photos ZIP">⤓</button>
      <div class="field" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <label style="margin:0">Photos Folder:</label>
        <span id="folderName" class="pill" style="font-weight:600;word-break:break-all">No folder selected</span>
        <button class="btn btn-sm" id="selectFolderBtn" type="button">Select Folder</button>
      </div>
      <div class="photos-actions">
        <button class="btn" id="uploadZipDriveBtn" type="button">Update Photos</button>
        <span class="pill photos-pill" id="photosSummary">No folder selected</span>
      </div>
    </div>

  </div>

  <!-- Status Modal -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal-box">
      <div class="modal-warning" id="modalWarning">⚠ Do not close this window until the operation is finished.</div>
      <div class="modal-spinner" id="modalSpinner"></div>
      <div class="modal-status" id="modalStatus"></div>
      <button class="modal-close-btn" id="modalCloseBtn" type="button">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const HEADERS = [
      "Name",
      "flat number",
      "Valid From",
      "ValidTill",
      "Aadhar/SRMID",
      "Moblie",
      "ID"
    ];

    // Set to true to also push the full-photos ZIP as a backup. Disabled for
    // now so we can test the incremental "faces" folder sync on its own.
    const ENABLE_ZIP_BACKUP = false;

    const HARDCODED_CONFIG = {
      scriptUrl: "https://script.google.com/macros/s/AKfycby2yjp7UEvBdYIDzKjOyFInegp_9CA7LVhpmbHbqwnxdPYEI5WJE8BYki-3Dwrgfm7pkw/exec",
      spreadsheetId: "1EDvYjDQVIpwib5PmQ5sbSchJI_B5HNHWNomXRLOxtk4",
      sheetName: "student id",
      driveZipFileId: "1De7JzvhoEHfsrVJzKojcQu_QgHq4tRUE"
    };

    const els = {
      selectFolderBtn: document.getElementById("selectFolderBtn"),
      folderName: document.getElementById("folderName"),
      photosSummary: document.getElementById("photosSummary"),
      uploadZipDriveBtn: document.getElementById("uploadZipDriveBtn")
    };

    // ---- Directory handle persistence via IndexedDB ----
    const DB_NAME = "idchecker-admin";
    const STORE_NAME = "handles";
    const HANDLE_KEY = "photosFolder";
    let selectedDirHandle = null;
    let selectedPhotosFiles = [];

    function openHandleDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveDirHandle(handle) {
      const db = await openHandleDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(handle, HANDLE_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadDirHandle() {
      const db = await openHandleDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(HANDLE_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function readImagesFromHandle(dirHandle) {
      const files = [];
      for await (const entry of dirHandle.values()) {
        if (entry.kind === "file") {
          const file = await entry.getFile();
          if (file.type.startsWith("image/")) files.push(file);
        }
      }
      return files;
    }

    async function pickFolder() {
      try {
        const handle = await window.showDirectoryPicker({ mode: "read" });
        selectedDirHandle = handle;
        await saveDirHandle(handle);
        selectedPhotosFiles = await readImagesFromHandle(handle);
        els.folderName.textContent = handle.name;
        updatePhotoSummary();
      } catch (err) {
        if (err.name !== "AbortError") setStatus("Folder pick failed: " + err.message, "bad");
      }
    }

    async function restoreSavedFolder() {
      try {
        const handle = await loadDirHandle();
        if (!handle) return;
        const perm = await handle.requestPermission({ mode: "read" });
        if (perm !== "granted") {
          els.folderName.textContent = handle.name + " (click Select Folder to re-grant)";
          return;
        }
        selectedDirHandle = handle;
        selectedPhotosFiles = await readImagesFromHandle(handle);
        els.folderName.textContent = handle.name;
        updatePhotoSummary();
      } catch (_) { /* first visit or denied */ }
    }

    let parsedRows = [];

    const modalEls = {
      overlay: document.getElementById("statusModal"),
      warning: document.getElementById("modalWarning"),
      spinner: document.getElementById("modalSpinner"),
      status: document.getElementById("modalStatus"),
      closeBtn: document.getElementById("modalCloseBtn")
    };
    modalEls.closeBtn.addEventListener("click", () => {
      modalEls.overlay.classList.remove("visible");
    });

    let operationInProgress = false;
    window.addEventListener("beforeunload", (e) => {
      if (operationInProgress) { e.preventDefault(); e.returnValue = ""; }
    });

    function showModal(message, tone) {
      modalEls.overlay.classList.add("visible");
      modalEls.status.textContent = message;
      modalEls.status.className = "modal-status" + (tone === "ok" ? " ok" : tone === "bad" ? " bad" : "");
      const inProgress = tone === "warn";
      operationInProgress = inProgress;
      modalEls.spinner.style.display = inProgress ? "inline-block" : "none";
      modalEls.warning.style.display = inProgress ? "block" : "none";
      modalEls.closeBtn.className = "modal-close-btn" + (inProgress ? "" : " visible");
    }

    function hideModal() {
      modalEls.overlay.classList.remove("visible");
    }

    function setStatus(message, tone) {
      if (tone === "warn" || tone === "ok" || tone === "bad") {
        showModal(message, tone);
      }
    }

    function normalizeHeader(value) {
      return String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function splitLine(line, delimiter) {
      const out = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === delimiter && !inQuotes) {
          out.push(current);
          current = "";
        } else {
          current += ch;
        }
      }
      out.push(current);
      return out.map((x) => x.trim().replace(/^"|"$/g, ""));
    }

    function parseRows(rawText) {
      const text = String(rawText || "").trim();
      if (!text) return [];

      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (!lines.length) return [];

      const delimiter = lines[0].includes("\t") ? "\t" : ",";
      const firstRow = splitLine(lines[0], delimiter);
      const normalizedFirst = firstRow.map(normalizeHeader);

      const hasHeader = normalizedFirst.some((x) => [
        "name", "flat number", "valid from", "validtill", "aadhar/srmid", "moblie", "id"
      ].includes(x));

      const sourceHeaders = hasHeader ? firstRow : HEADERS;
      const dataLines = hasHeader ? lines.slice(1) : lines;

      const indexMap = {
        Name: sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "name" || (!hasHeader && i === 0);
        }),
        "flat number": sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "flat number" || v === "flat" || (!hasHeader && i === 1);
        }),
        "Valid From": sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "valid from" || v === "validfrom" || (!hasHeader && i === 2);
        }),
        ValidTill: sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "validtill" || v === "valid till" || (!hasHeader && i === 3);
        }),
        "Aadhar/SRMID": sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "aadhar/srmid" || v === "aadhar" || (!hasHeader && i === 4);
        }),
        Moblie: sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "moblie" || v === "mobile" || (!hasHeader && i === 5);
        }),
        ID: sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "id" || (!hasHeader && i === 6);
        })
      };

      const rows = [];

      dataLines.forEach((line) => {
        const cols = splitLine(line, delimiter);
        const row = {};

        HEADERS.forEach((key) => {
          const idx = indexMap[key];
          row[key] = idx >= 0 ? String(cols[idx] || "").trim() : "";
        });

        if (row.ID || row.Name) rows.push(row);
      });

      return rows;
    }

    function getSelectedPhotos() {
      return selectedPhotosFiles;
    }

    function getFileNameOnly(file) {
      return file.name;
    }

    async function createPhotosZipBase64(files) {
      if (!files.length) return "";
      const zip = new JSZip();
      files.forEach((file) => {
        zip.file(getFileNameOnly(file), file);
      });
      return zip.generateAsync({ type: "base64", compression: "DEFLATE", compressionOptions: { level: 6 } });
    }

    function validateRows(rows) {
      const errors = [];
      rows.forEach((r, idx) => {
        if (!r.ID) errors.push("Row " + (idx + 1) + ": missing ID");
        if (!r.Name) errors.push("Row " + (idx + 1) + ": missing Name");
      });
      return errors;
    }

    function updatePhotoSummary() {
      const files = getSelectedPhotos();
      if (!files.length) {
        els.photosSummary.textContent = "No folder selected";
        return;
      }
      const sampleNames = files.slice(0, 3).map((f) => getFileNameOnly(f)).join(", ");
      els.photosSummary.textContent = files.length + " image(s) in folder" + (sampleNames ? " | " + sampleNames + (files.length > 3 ? " ..." : "") : "");
    }

    async function compressImage(file, targetSizeKB) {
      const TARGET_BYTES = targetSizeKB * 1024;
      const img = await createImageBitmap(file);

      // Scale down if needed to help reach target size
      let width = img.width;
      let height = img.height;
      const MAX_DIM = 800;
      if (width > MAX_DIM || height > MAX_DIM) {
        const scale = MAX_DIM / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      // Binary search for the right JPEG quality to hit ~targetSizeKB
      let lo = 0.1, hi = 0.92, bestBlob = null;
      for (let i = 0; i < 7; i++) {
        const mid = (lo + hi) / 2;
        const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", mid));
        bestBlob = blob;
        if (blob.size > TARGET_BYTES) {
          hi = mid;
        } else {
          lo = mid;
        }
      }

      // If still too large after lowest quality, scale down further
      if (bestBlob.size > TARGET_BYTES * 1.5) {
        const shrink = Math.sqrt(TARGET_BYTES / bestBlob.size);
        canvas.width = Math.round(width * shrink);
        canvas.height = Math.round(height * shrink);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        bestBlob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.7));
      }

      return bestBlob;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const result = String(reader.result || "");
          const commaIndex = result.indexOf(",");
          resolve(commaIndex >= 0 ? result.slice(commaIndex + 1) : result);
        };
        reader.onerror = () => reject(new Error("Failed to read ZIP blob"));
        reader.readAsDataURL(blob);
      });
    }

    // ---- JSONP helper for Apps Script GET actions (avoids CORS) ----
    function jsonp(action, params) {
      return new Promise((resolve, reject) => {
        const cbName = "_jsonpCb_" + action + "_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
        const qs = Object.keys(params || {})
          .map((k) => k + "=" + encodeURIComponent(params[k]))
          .join("&");
        const url = HARDCODED_CONFIG.scriptUrl + "?action=" + action +
          (qs ? "&" + qs : "") + "&callback=" + encodeURIComponent(cbName);
        const script = document.createElement("script");
        let done = false;
        const cleanup = () => { if (script.parentNode) script.parentNode.removeChild(script); try { delete window[cbName]; } catch (_) {} };
        const timeout = setTimeout(() => { if (done) return; done = true; cleanup(); reject(new Error("Timed out: " + action)); }, 25000);
        window[cbName] = (resp) => {
          if (done) return; done = true; clearTimeout(timeout); cleanup();
          if (resp && resp.ok) resolve(resp.result);
          else reject(new Error((resp && resp.error) || ("Failed: " + action)));
        };
        script.onerror = () => { if (done) return; done = true; clearTimeout(timeout); cleanup(); reject(new Error("Script load failed: " + action)); };
        script.src = url;
        document.head.appendChild(script);
      });
    }

    function getAccessToken() {
      return jsonp("get_upload_url", { token: _adminToken, fileId: HARDCODED_CONFIG.driveZipFileId })
        .then((r) => { if (!r || !r.accessToken) throw new Error("No access token returned"); return r.accessToken; });
    }

    function getFacesFolderId() {
      return jsonp("get_faces", { fileId: HARDCODED_CONFIG.driveZipFileId })
        .then((r) => (r && r.found ? r.folderId : null));
    }

    function getStudentFlags() {
      return jsonp("get_student_flags", { token: _adminToken }).then((r) => (r && r.rows) || []);
    }

    // ---- Direct Google Drive REST helpers (browser-initiated → CORS OK) ----
    async function driveFindFiles(token, folderId, names) {
      const namesClause = names.map((n) => "name='" + String(n).replace(/'/g, "\\'") + "'").join(" or ");
      const q = "'" + folderId + "' in parents and (" + namesClause + ") and trashed=false";
      const url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
        "&fields=files(id,name)&spaces=drive&pageSize=10";
      const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
      if (!res.ok) throw new Error("Drive list failed (" + res.status + ")");
      const data = await res.json();
      return data.files || [];
    }

    async function driveUploadFace(token, folderId, id, blob) {
      const name = id + ".jpg";
      const existing = await driveFindFiles(token, folderId, [name]);
      let fileId = existing.length ? existing[0].id : null;
      if (!fileId) {
        const createRes = await fetch("https://www.googleapis.com/drive/v3/files?fields=id", {
          method: "POST",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, parents: [folderId] })
        });
        if (!createRes.ok) throw new Error("Create failed (" + createRes.status + "): " + (await createRes.text()).slice(0, 200));
        fileId = (await createRes.json()).id;
      }
      const patchRes = await fetch("https://www.googleapis.com/upload/drive/v3/files/" +
        encodeURIComponent(fileId) + "?uploadType=media", {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "image/jpeg" },
        body: blob
      });
      if (!patchRes.ok) throw new Error("Upload failed (" + patchRes.status + "): " + (await patchRes.text()).slice(0, 200));
    }

    async function driveDeleteFace(token, folderId, id) {
      const names = [id + ".jpg", id + ".jpeg", id + ".png", id + ".webp"];
      const files = await driveFindFiles(token, folderId, names);
      let removed = 0;
      for (const f of files) {
        const delRes = await fetch("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(f.id), {
          method: "DELETE", headers: { Authorization: "Bearer " + token }
        });
        if (delRes.ok || delRes.status === 204) removed++;
      }
      return removed;
    }

    // List the stems (filename without extension, lower-cased) already present
    // in a Drive folder, paging through every result.
    async function driveListFolderStems(token, folderId) {
      const stems = new Set();
      let pageToken = "";
      do {
        const q = "'" + folderId + "' in parents and trashed=false";
        let url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) +
          "&fields=nextPageToken,files(name)&spaces=drive&pageSize=1000";
        if (pageToken) url += "&pageToken=" + encodeURIComponent(pageToken);
        const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error("Drive folder list failed (" + res.status + ")");
        const data = await res.json();
        (data.files || []).forEach((f) => {
          const stem = String(f.name || "").replace(/\.[^.]+$/, "").toLowerCase();
          if (stem) stems.add(stem);
        });
        pageToken = data.nextPageToken || "";
      } while (pageToken);
      return stems;
    }

    /**
     * Incrementally sync the Drive "faces" folder against the sheet:
     *  - upload a face when it is MISSING from the folder (new student) or the
     *    row is explicitly flagged new/updated (n/u/up);
     *  - delete a face when the row is flagged delete (d).
     * Faces already present and not flagged for update are left untouched, so
     * repeat runs only push genuinely new/changed photos.
     */
    async function syncFacesFolder(token, facesFolderId, flags, filesById) {
      setStatus("Checking existing faces in Drive folder...", "warn");
      const existing = await driveListFolderStems(token, facesFolderId);

      const toUpload = [];
      const toDelete = [];
      let missing = 0;
      for (const r of flags) {
        const id = r.id;
        if (r.flag === "d") { toDelete.push(id); continue; }
        const file = filesById.get(id.toLowerCase());
        const present = existing.has(id.toLowerCase());
        const flaggedChange = ["n", "u", "up"].includes(r.flag);
        if (!present || flaggedChange) {
          if (file) toUpload.push({ id: id, file: file });
          else if (!present) missing++; // needed but no local image to upload
        }
      }

      let uploaded = 0, deleted = 0, failed = 0;
      for (let i = 0; i < toUpload.length; i++) {
        const id = toUpload[i].id;
        setStatus("Faces " + (i + 1) + "/" + toUpload.length + " — uploading " + id + "...", "warn");
        try {
          const compressed = await compressImage(toUpload[i].file, 50);
          await driveUploadFace(token, facesFolderId, id, compressed);
          uploaded++;
        } catch (e) { failed++; console.warn("Face upload failed for " + id, e); }
      }

      for (let i = 0; i < toDelete.length; i++) {
        const id = toDelete[i];
        setStatus("Faces — removing " + id + " (" + (i + 1) + "/" + toDelete.length + ")...", "warn");
        try { deleted += await driveDeleteFace(token, facesFolderId, id); }
        catch (e) { console.warn("Face delete failed for " + id, e); }
      }

      return { uploaded, missing, deleted, failed, uploadCount: toUpload.length, deleteCount: toDelete.length };
    }

    // ZIP backup upload — keeps the legacy full-ZIP path working alongside the
    // incremental faces folder. Uses an already-fetched OAuth token.
    async function runZipBackup(token, photos) {
      const driveZipFileId = HARDCODED_CONFIG.driveZipFileId;
      const zip = new JSZip();
      for (let i = 0; i < photos.length; i++) {
        const file = photos[i];
        setStatus("ZIP backup — compressing photo " + (i + 1) + "/" + photos.length + ": " + file.name, "warn");
        const compressed = await compressImage(file, 50);
        const nameBase = file.name.replace(/\.[^.]+$/, "") + ".jpg";
        zip.file(nameBase, compressed);
      }
      setStatus("ZIP backup — zipping " + photos.length + " photos...", "warn");
      const zipBlob = await zip.generateAsync(
        { type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } },
        function (meta) { setStatus("ZIP backup — zipping: " + meta.percent.toFixed(0) + "%", "warn"); }
      );
      setStatus("ZIP backup — uploading faces.zip (" + (zipBlob.size / 1024).toFixed(0) + " KB) to Drive...", "warn");
      const driveUrl = "https://www.googleapis.com/upload/drive/v3/files/" +
        encodeURIComponent(driveZipFileId) + "?uploadType=media";
      const uploadResp = await fetch(driveUrl, {
        method: "PATCH",
        body: zipBlob,
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/zip" }
      });
      if (!uploadResp.ok) {
        const errText = await uploadResp.text();
        throw new Error("ZIP upload failed (" + uploadResp.status + "): " + errText.substring(0, 300));
      }
      return zipBlob.size;
    }

    // Button handler: incremental faces-folder sync first, then ZIP backup.
    async function updatePhotos() {
      const photos = getSelectedPhotos();
      if (!photos.length) {
        setStatus("Select a photos folder first.", "bad");
        return;
      }
      if (!HARDCODED_CONFIG.scriptUrl || !HARDCODED_CONFIG.driveZipFileId) {
        setStatus("Hardcoded Drive config is missing required values.", "bad");
        return;
      }

      els.uploadZipDriveBtn.disabled = true;
      try {
        setStatus("Preparing — getting Drive credentials...", "warn");
        const token = await getAccessToken();

        // Phase 1: incremental faces folder (only if a "faces" folder exists)
        let facesSummary = "Faces folder: not found (skipped)";
        const facesFolderId = await getFacesFolderId();
        if (facesFolderId) {
          setStatus("Reading sheet update flags...", "warn");
          const flags = await getStudentFlags();
          const filesById = new Map();
          photos.forEach((f) => filesById.set(f.name.replace(/\.[^.]+$/, "").toLowerCase(), f));
          const r = await syncFacesFolder(token, facesFolderId, flags, filesById);
          facesSummary = "Faces folder: ↑" + r.uploaded + " uploaded, " + r.deleted + " removed" +
            (r.missing ? ", " + r.missing + " missing file(s)" : "") +
            (r.failed ? ", " + r.failed + " failed" : "");
        }

        // Phase 2: ZIP backup — disabled for now while we test the faces folder.
        // Flip ENABLE_ZIP_BACKUP back to true to resume the full-ZIP backup.
        let zipSummary = "ZIP backup: disabled";
        if (ENABLE_ZIP_BACKUP) {
          const zipSize = await runZipBackup(token, photos);
          zipSummary = "ZIP backup: " + photos.length + " photos | " + (zipSize / 1024).toFixed(0) + " KB";
        }

        setStatus("Done!\n" + facesSummary + "\n" + zipSummary, "ok");
      } catch (err) {
        setStatus("Update failed: " + (err.message || err), "bad");
      } finally {
        els.uploadZipDriveBtn.disabled = false;
      }
    }

    async function downloadZip() {
      const photos = getSelectedPhotos();
      if (!photos.length) {
        setStatus("Select a photos folder first.", "bad");
        return;
      }

      els.downloadZipBtn.disabled = true;
      try {
        const zip = new JSZip();

        for (let i = 0; i < photos.length; i++) {
          const file = photos[i];
          setStatus("Adding photo " + (i + 1) + "/" + photos.length + ": " + file.name, "warn");
          zip.file(getFileNameOnly(file), file);
        }

        setStatus("Zipping " + photos.length + " photos...", "warn");
        const blob = await zip.generateAsync(
          { type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } },
          function(meta) { setStatus("Zipping: " + meta.percent.toFixed(0) + "%", "warn"); }
        );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "faces.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        setStatus("ZIP downloaded (" + photos.length + " photos, " + (blob.size / 1024).toFixed(0) + " KB total).\nManually upload faces.zip to Google Drive to replace the existing ZIP.", "ok");
      } catch (err) {
        setStatus("ZIP creation failed: " + (err.message || err), "bad");
      } finally {
        els.downloadZipBtn.disabled = false;
      }
    }

    els.downloadZipBtn = document.getElementById("downloadZipBtn");
    els.downloadZipBtn.addEventListener("click", downloadZip);
    els.uploadZipDriveBtn.addEventListener("click", updatePhotos);
    els.selectFolderBtn.addEventListener("click", pickFolder);
    restoreSavedFolder();
  </script>
</body>
