<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Checker Admin Uploader</title>
  <style>
    :root {
      --bg: #FFFBEB;
      --card: #ffffff;
      --text: #78350F;
      --muted: #A89080;
      --border: #E5D4C8;
      --brand: #D97706;
      --ok: #0f766e;
      --warn: #F59E0B;
      --bad: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top right, #F5E6D3 0%, #FFFBEB 40%, #FFF8F0 100%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    .shell {
      max-width: 100%;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 200px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      line-height: 1.45;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .photos-actions {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .photos-card {
      position: relative;
      padding-top: 22px;
    }

    .icon-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background: #FEF3E2;
      border-color: #E5D4C8;
      color: #78350F;
    }

    .icon-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px;
      padding: 6px 10px;
      color: var(--muted);
      background: #f8fafc;
    }

    .pill.photos-pill {
      background: #f1f5f9;
      border-color: #d6e0ec;
      font-size: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.45;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      padding: 10px 12px;
      min-height: 72px;
    }

    .status.ok { border-color: #99f6e4; background: #f0fdfa; color: var(--ok); }
    .status.warn { border-color: #fed7aa; background: #fff7ed; color: var(--warn); }
    .status.bad { border-color: #fecaca; background: #fef2f2; color: var(--bad); }

    /* Modal overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 28px 32px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .modal-box .modal-warning {
      font-size: 13px;
      font-weight: 700;
      color: var(--bad);
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }
    .modal-box .modal-spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-box .modal-status {
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
      color: var(--text);
      min-height: 40px;
    }
    .modal-box .modal-status.ok { color: var(--ok); }
    .modal-box .modal-status.bad { color: var(--bad); }
    .modal-box .modal-close-btn {
      display: none;
      margin-top: 16px;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      padding: 10px 28px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-box .modal-close-btn.visible { display: inline-block; }

    code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 5px;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Password gate -->
  <div id="passwordGate" style="position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at top right,#F5E6D3 0%,#FFFBEB 40%,#FFF8F0 100%);display:flex;align-items:center;justify-content:center">
    <div style="background:#fff;border:2px solid #78350F;border-radius:12px;padding:40px;text-align:center;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.12)">
      <div style="font-size:48px;margin-bottom:12px">🔒</div>
      <h2 style="margin:0 0 8px;color:#78350F;font-size:20px;letter-spacing:1px">ADMIN ACCESS</h2>
      <p style="margin:0 0 20px;color:#A89080;font-size:14px">Enter password to continue</p>
      <input id="gatePassword" type="password" placeholder="Password" autocomplete="off"
        style="width:100%;padding:12px;border:2px solid #E5D4C8;border-radius:8px;font-size:16px;text-align:center;outline:none"
        onkeydown="if(event.key==='Enter')document.getElementById('gateSubmit').click()" />
      <p id="gateError" style="color:#b91c1c;font-size:13px;margin:8px 0 0;display:none">INCORRECT PASSWORD</p>
      <button id="gateSubmit" type="button" onclick="checkGatePassword()"
        style="margin-top:16px;width:100%;padding:12px;background:#78350F;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px">
        UNLOCK
      </button>
    </div>
  </div>
  <script>
    var _adminToken = '';
    function checkGatePassword() {
      var pw = document.getElementById('gatePassword').value;
      if (pw === 'Admin2026') {
        _adminToken = pw;
        document.getElementById('passwordGate').style.display = 'none';
      } else {
        document.getElementById('gateError').style.display = 'block';
        document.getElementById('gatePassword').value = '';
        document.getElementById('gatePassword').focus();
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('gatePassword').focus();
    });
  </script>

  <div class="shell">
    <div class="card">
      <h1>ID Checker Admin</h1>
    </div>

    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="field" style="flex:1;min-height:0;display:flex;flex-direction:column">
        <div class="row" style="gap:10px;align-items:center;margin-bottom:6px">
          <label style="margin:0">Google Sheet — <code>student id</code></label>
          <button class="btn btn-sm" type="button" onclick="document.getElementById('sheetEmbed').src = document.getElementById('sheetEmbed').src">Refresh</button>
          <button class="btn btn-sm" type="button" onclick="window.open('https://docs.google.com/spreadsheets/d/1EDvYjDQVIpwib5PmQ5sbSchJI_B5HNHWNomXRLOxtk4/edit#gid=0','sheetEditor','width=1200,height=800,menubar=no,toolbar=no')">Open Editor ↗</button>
        </div>
        <iframe id="sheetEmbed"
          src="https://docs.google.com/spreadsheets/d/1EDvYjDQVIpwib5PmQ5sbSchJI_B5HNHWNomXRLOxtk4/edit?rm=minimal&gid=0"
          style="width:100%;flex:1;border:1px solid var(--border);border-radius:8px;background:#fff"
          loading="lazy" allow="clipboard-read; clipboard-write"></iframe>
      </div>
    </div>

    <div class="card photos-card">
      <button class="icon-btn" id="downloadZipBtn" type="button" aria-label="Download Photos ZIP">⤓</button>
      <div class="field" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <label style="margin:0">Photos Folder:</label>
        <span id="folderName" class="pill" style="font-weight:600;word-break:break-all">No folder selected</span>
        <button class="btn btn-sm" id="selectFolderBtn" type="button">Select Folder</button>
      </div>
      <div class="photos-actions">
        <button class="btn" id="uploadZipDriveBtn" type="button">Update Photos</button>
        <span class="pill photos-pill" id="photosSummary">No folder selected</span>
      </div>
    </div>

  </div>

  <!-- Status Modal -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal-box">
      <div class="modal-warning" id="modalWarning">⚠ Do not close this window until the operation is finished.</div>
      <div class="modal-spinner" id="modalSpinner"></div>
      <div class="modal-status" id="modalStatus"></div>
      <button class="modal-close-btn" id="modalCloseBtn" type="button">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const HEADERS = [
      "Name",
      "flat number",
      "Valid From",
      "ValidTill",
      "Aadhar/SRMID",
      "Moblie",
      "ID"
    ];

    const HARDCODED_CONFIG = {
      scriptUrl: "https://script.google.com/macros/s/AKfycby2yjp7UEvBdYIDzKjOyFInegp_9CA7LVhpmbHbqwnxdPYEI5WJE8BYki-3Dwrgfm7pkw/exec",
      spreadsheetId: "1EDvYjDQVIpwib5PmQ5sbSchJI_B5HNHWNomXRLOxtk4",
      sheetName: "student id",
      driveZipFileId: "1De7JzvhoEHfsrVJzKojcQu_QgHq4tRUE"
    };

    const els = {
      selectFolderBtn: document.getElementById("selectFolderBtn"),
      folderName: document.getElementById("folderName"),
      photosSummary: document.getElementById("photosSummary"),
      uploadZipDriveBtn: document.getElementById("uploadZipDriveBtn")
    };

    // ---- Directory handle persistence via IndexedDB ----
    const DB_NAME = "idchecker-admin";
    const STORE_NAME = "handles";
    const HANDLE_KEY = "photosFolder";
    let selectedDirHandle = null;
    let selectedPhotosFiles = [];

    function openHandleDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveDirHandle(handle) {
      const db = await openHandleDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(handle, HANDLE_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadDirHandle() {
      const db = await openHandleDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(HANDLE_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function readImagesFromHandle(dirHandle) {
      const files = [];
      for await (const entry of dirHandle.values()) {
        if (entry.kind === "file") {
          const file = await entry.getFile();
          if (file.type.startsWith("image/")) files.push(file);
        }
      }
      return files;
    }

    async function pickFolder() {
      try {
        const handle = await window.showDirectoryPicker({ mode: "read" });
        selectedDirHandle = handle;
        await saveDirHandle(handle);
        selectedPhotosFiles = await readImagesFromHandle(handle);
        els.folderName.textContent = handle.name;
        updatePhotoSummary();
      } catch (err) {
        if (err.name !== "AbortError") setStatus("Folder pick failed: " + err.message, "bad");
      }
    }

    async function restoreSavedFolder() {
      try {
        const handle = await loadDirHandle();
        if (!handle) return;
        const perm = await handle.requestPermission({ mode: "read" });
        if (perm !== "granted") {
          els.folderName.textContent = handle.name + " (click Select Folder to re-grant)";
          return;
        }
        selectedDirHandle = handle;
        selectedPhotosFiles = await readImagesFromHandle(handle);
        els.folderName.textContent = handle.name;
        updatePhotoSummary();
      } catch (_) { /* first visit or denied */ }
    }

    let parsedRows = [];

    const modalEls = {
      overlay: document.getElementById("statusModal"),
      warning: document.getElementById("modalWarning"),
      spinner: document.getElementById("modalSpinner"),
      status: document.getElementById("modalStatus"),
      closeBtn: document.getElementById("modalCloseBtn")
    };
    modalEls.closeBtn.addEventListener("click", () => {
      modalEls.overlay.classList.remove("visible");
    });

    let operationInProgress = false;
    window.addEventListener("beforeunload", (e) => {
      if (operationInProgress) { e.preventDefault(); e.returnValue = ""; }
    });

    function showModal(message, tone) {
      modalEls.overlay.classList.add("visible");
      modalEls.status.textContent = message;
      modalEls.status.className = "modal-status" + (tone === "ok" ? " ok" : tone === "bad" ? " bad" : "");
      const inProgress = tone === "warn";
      operationInProgress = inProgress;
      modalEls.spinner.style.display = inProgress ? "inline-block" : "none";
      modalEls.warning.style.display = inProgress ? "block" : "none";
      modalEls.closeBtn.className = "modal-close-btn" + (inProgress ? "" : " visible");
    }

    function hideModal() {
      modalEls.overlay.classList.remove("visible");
    }

    function setStatus(message, tone) {
      if (tone === "warn" || tone === "ok" || tone === "bad") {
        showModal(message, tone);
      }
    }

    function normalizeHeader(value) {
      return String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function splitLine(line, delimiter) {
      const out = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === delimiter && !inQuotes) {
          out.push(current);
          current = "";
        } else {
          current += ch;
        }
      }
      out.push(current);
      return out.map((x) => x.trim().replace(/^"|"$/g, ""));
    }

    function parseRows(rawText) {
      const text = String(rawText || "").trim();
      if (!text) return [];

      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (!lines.length) return [];

      const delimiter = lines[0].includes("\t") ? "\t" : ",";
      const firstRow = splitLine(lines[0], delimiter);
      const normalizedFirst = firstRow.map(normalizeHeader);

      const hasHeader = normalizedFirst.some((x) => [
        "name", "flat number", "valid from", "validtill", "aadhar/srmid", "moblie", "id"
      ].includes(x));

      const sourceHeaders = hasHeader ? firstRow : HEADERS;
      const dataLines = hasHeader ? lines.slice(1) : lines;

      const indexMap = {
        Name: sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "name" || (!hasHeader && i === 0);
        }),
        "flat number": sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "flat number" || v === "flat" || (!hasHeader && i === 1);
        }),
        "Valid From": sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "valid from" || v === "validfrom" || (!hasHeader && i === 2);
        }),
        ValidTill: sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "validtill" || v === "valid till" || (!hasHeader && i === 3);
        }),
        "Aadhar/SRMID": sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "aadhar/srmid" || v === "aadhar" || (!hasHeader && i === 4);
        }),
        Moblie: sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "moblie" || v === "mobile" || (!hasHeader && i === 5);
        }),
        ID: sourceHeaders.findIndex((h, i) => {
          const v = normalizeHeader(h);
          return v === "id" || (!hasHeader && i === 6);
        })
      };

      const rows = [];

      dataLines.forEach((line) => {
        const cols = splitLine(line, delimiter);
        const row = {};

        HEADERS.forEach((key) => {
          const idx = indexMap[key];
          row[key] = idx >= 0 ? String(cols[idx] || "").trim() : "";
        });

        if (row.ID || row.Name) rows.push(row);
      });

      return rows;
    }

    function getSelectedPhotos() {
      return selectedPhotosFiles;
    }

    function getFileNameOnly(file) {
      return file.name;
    }

    async function createPhotosZipBase64(files) {
      if (!files.length) return "";
      const zip = new JSZip();
      files.forEach((file) => {
        zip.file(getFileNameOnly(file), file);
      });
      return zip.generateAsync({ type: "base64", compression: "DEFLATE", compressionOptions: { level: 6 } });
    }

    function validateRows(rows) {
      const errors = [];
      rows.forEach((r, idx) => {
        if (!r.ID) errors.push("Row " + (idx + 1) + ": missing ID");
        if (!r.Name) errors.push("Row " + (idx + 1) + ": missing Name");
      });
      return errors;
    }

    function updatePhotoSummary() {
      const files = getSelectedPhotos();
      if (!files.length) {
        els.photosSummary.textContent = "No folder selected";
        return;
      }
      const sampleNames = files.slice(0, 3).map((f) => getFileNameOnly(f)).join(", ");
      els.photosSummary.textContent = files.length + " image(s) in folder" + (sampleNames ? " | " + sampleNames + (files.length > 3 ? " ..." : "") : "");
    }

    async function compressImage(file, targetSizeKB) {
      const TARGET_BYTES = targetSizeKB * 1024;
      const img = await createImageBitmap(file);

      // Scale down if needed to help reach target size
      let width = img.width;
      let height = img.height;
      const MAX_DIM = 800;
      if (width > MAX_DIM || height > MAX_DIM) {
        const scale = MAX_DIM / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      // Binary search for the right JPEG quality to hit ~targetSizeKB
      let lo = 0.1, hi = 0.92, bestBlob = null;
      for (let i = 0; i < 7; i++) {
        const mid = (lo + hi) / 2;
        const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", mid));
        bestBlob = blob;
        if (blob.size > TARGET_BYTES) {
          hi = mid;
        } else {
          lo = mid;
        }
      }

      // If still too large after lowest quality, scale down further
      if (bestBlob.size > TARGET_BYTES * 1.5) {
        const shrink = Math.sqrt(TARGET_BYTES / bestBlob.size);
        canvas.width = Math.round(width * shrink);
        canvas.height = Math.round(height * shrink);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        bestBlob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.7));
      }

      return bestBlob;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const result = String(reader.result || "");
          const commaIndex = result.indexOf(",");
          resolve(commaIndex >= 0 ? result.slice(commaIndex + 1) : result);
        };
        reader.onerror = () => reject(new Error("Failed to read ZIP blob"));
        reader.readAsDataURL(blob);
      });
    }

    async function uploadZipToDrive() {
      const photos = getSelectedPhotos();
      if (!photos.length) {
        setStatus("Select a photos folder first.", "bad");
        return;
      }

      const scriptUrl = HARDCODED_CONFIG.scriptUrl;
      const driveZipFileId = HARDCODED_CONFIG.driveZipFileId;

      if (!scriptUrl || !driveZipFileId) {
        setStatus("Hardcoded Drive ZIP config is missing required values.", "bad");
        return;
      }

      const token = _adminToken;

      els.uploadZipDriveBtn.disabled = true;
      try {
        const zip = new JSZip();

        // Step 1: Compress photos
        for (let i = 0; i < photos.length; i++) {
          const file = photos[i];
          setStatus("Step 1/3 — Compressing photo " + (i + 1) + "/" + photos.length + ": " + file.name, "warn");
          const compressed = await compressImage(file, 50);
          const nameBase = file.name.replace(/\.[^.]+$/, "") + ".jpg";
          zip.file(nameBase, compressed);
        }

        // Step 2: Create ZIP blob
        setStatus("Step 2/3 — Zipping " + photos.length + " photos...", "warn");
        const zipBlob = await zip.generateAsync(
          { type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } },
          function(meta) { setStatus("Step 2/3 — Zipping: " + meta.percent.toFixed(0) + "%", "warn"); }
        );

        // Step 3: Get resumable upload URL from Apps Script, then upload directly to Drive
        setStatus("Step 3/3 — Getting upload URL...", "warn");

        // Fetch resumable upload URL via JSONP (avoids CORS issues with Apps Script GET)
        const uploadUrl = await new Promise((resolve, reject) => {
          const cbName = "_uploadUrlCb_" + Date.now();
          const url = scriptUrl + "?action=get_upload_url&token=" + encodeURIComponent(token) +
            "&fileId=" + encodeURIComponent(driveZipFileId) +
            "&callback=" + encodeURIComponent(cbName);
          const script = document.createElement("script");
          let done = false;
          const cleanup = () => { if (script.parentNode) script.parentNode.removeChild(script); try { delete window[cbName]; } catch (_) {} };
          const timeout = setTimeout(() => { if (done) return; done = true; cleanup(); reject(new Error("Timed out getting upload URL")); }, 15000);
          window[cbName] = (resp) => {
            if (done) return; done = true; clearTimeout(timeout); cleanup();
            if (resp && resp.ok && resp.result && resp.result.uploadUrl) {
              resolve(resp.result.uploadUrl);
            } else {
              reject(new Error((resp && resp.error) || "Failed to get upload URL"));
            }
          };
          script.onerror = () => { if (done) return; done = true; clearTimeout(timeout); cleanup(); reject(new Error("Script load failed")); };
          script.src = url;
          document.head.appendChild(script);
        });

        setStatus("Step 3/3 — Uploading faces.zip (" + (zipBlob.size / 1024).toFixed(0) + " KB, " + photos.length + " photos) directly to Google Drive...", "warn");

        // Upload raw ZIP blob directly to Drive resumable URL
        const uploadResp = await fetch(uploadUrl, {
          method: "PUT",
          body: zipBlob,
          headers: { "Content-Type": "application/zip" }
        });

        if (!uploadResp.ok) {
          const errText = await uploadResp.text();
          throw new Error("Drive upload failed (" + uploadResp.status + "): " + errText.substring(0, 300));
        }

        setStatus("Done! ZIP replaced on Google Drive.\n" + photos.length + " photos | " + (zipBlob.size / 1024).toFixed(0) + " KB\nDrive file: " + driveZipFileId, "ok");
      } catch (err) {
        setStatus("Drive ZIP upload failed: " + (err.message || err), "bad");
      } finally {
        els.uploadZipDriveBtn.disabled = false;
      }
    }

    async function downloadZip() {
      const photos = getSelectedPhotos();
      if (!photos.length) {
        setStatus("Select a photos folder first.", "bad");
        return;
      }

      els.downloadZipBtn.disabled = true;
      try {
        const zip = new JSZip();

        for (let i = 0; i < photos.length; i++) {
          const file = photos[i];
          setStatus("Adding photo " + (i + 1) + "/" + photos.length + ": " + file.name, "warn");
          zip.file(getFileNameOnly(file), file);
        }

        setStatus("Zipping " + photos.length + " photos...", "warn");
        const blob = await zip.generateAsync(
          { type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } },
          function(meta) { setStatus("Zipping: " + meta.percent.toFixed(0) + "%", "warn"); }
        );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "faces.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        setStatus("ZIP downloaded (" + photos.length + " photos, " + (blob.size / 1024).toFixed(0) + " KB total).\nManually upload faces.zip to Google Drive to replace the existing ZIP.", "ok");
      } catch (err) {
        setStatus("ZIP creation failed: " + (err.message || err), "bad");
      } finally {
        els.downloadZipBtn.disabled = false;
      }
    }

    els.downloadZipBtn = document.getElementById("downloadZipBtn");
    els.downloadZipBtn.addEventListener("click", downloadZip);
    els.uploadZipDriveBtn.addEventListener("click", uploadZipToDrive);
    els.selectFolderBtn.addEventListener("click", pickFolder);
    restoreSavedFolder();
  </script>
</body>
</html>
